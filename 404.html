<!doctype html>

<style>
:root{
  --paper:#F3F3F1; --ink:#17181B; --ink-2:#4A4D53; --ink-3:#7C8087;

html{color-scheme:light;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);

.top{border-bottom:1px solid var(--rule)}
.top .w{display:flex;align-items:center;gap:1px;padding:8px clamp(20px,5vw,32px)}
.top .wm{font:600 30px/1 var(--sans);letter-spacing:-.032em;margin-left:-5px}
.top a{display:flex;align-items:center;gap:1px;color:inherit;text-decoration:none}
main{padding:64px 0 96px}
h1{font:600 clamp(27px,3.7vw,35px)/1.2 var(--sans);letter-spacing:-.025em;margin:0 0 12px}
p{color:var(--ink-2);margin:0 0 13px}
.back{display:inline-block;margin-top:20px;font-size:17px}

<div class="top">
  <div class="w">
    <a href="/" aria-label="OMNOR — на главную">
      <svg width="54" height="54" viewBox="0 0 84 80" aria-hidden="true">

          stroke="#D6541C" stroke-width="11" stroke-linecap="round" stroke-dasharray="142.46 20.9"/></g>
        <circle cx="42" cy="40" r="8.5" fill="#D6541C"/>
      </svg>
      <span class="wm">mnor</span>
    </a>
  </div>
</div>
<main>

    <h1>Такой страницы нет</h1>

    <a class="back" href="/">На главную OMNOR →</a>
  </div>
